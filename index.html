<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Rembrant</title>
    <style>
      ::selection {
        background-color: rgb(240, 238, 233);
      }
      html {
        background: white;
      }
      body {
        -webkit-font-smoothing: antialiased;
        place-content: center;
        line-height: 21px;
        font-size: 13px;
        display: grid;
        margin: 21px;
      }
      @media (orientation: landscape) {
        body {
          min-height: calc(100dvh - 42px);
        }
      }
      main {
        max-width: 336px;
        margin: 0;
      }
      h1 {
        margin: 0 0 21px 0;
        line-height: 21px;
        font-weight: 400;
        font-size: 13px;
      }
      p {
        color: rgb(0, 0, 0, 0.875);
        margin: 0 0 21px 0;
      }
      a {
        text-decoration-color: rgb(0, 0, 0, 0.125);
        text-underline-offset: 2px;
        color: inherit;
      }
      a:hover,
      a:focus {
        text-decoration-color: rgb(0, 0, 0, 0.25);
      }
      a:active {
        text-decoration-color: rgb(0, 0, 0, 0.875);
      }
      canvas {
        background-color: rgb(248, 247, 245);
        margin: 21px 0 42px 0;
        cursor: pointer;
        height: 336px;
        width: 336px;
      }
      footer {
        display: flex;
        gap: 21px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>
        <a href="/">Rembrant</a>
      </h1>
      <p>
        I'm a design engineer and creator of <em>Emergence</em>&mdash;a design system for ecommerce grounded in behavioral science.
        <br/>
        <em>
          <a target="_blank" href="https://rvdmijnsbrugge.myshopify.com">View the demo</a>
        </em>
      </p>
      <p>
        Contact me for licensing:
        <em>
          <a href="mailto:r@mote.agency?subject=Emergence%20Licensing">r@mote.agency</a>
        </em>
      </p>
      <canvas width="1344" height="1344" aria-hidden="true"></canvas>
      <footer>
        <em>
          <a target="_blank" href="https://www.shopify.com/blog/search?q=Rembrant">Shopify</a>
        </em>
        <em>
          <a target="_blank" href="https://github.com/rvdmijnsbrugge">GitHub</a>
        </em>
        <em>
          <a target="_blank" href="https://x.com/rvdmijnsbrugge">Twitter</a>
        </em>
      </footer>
    </main>
    <script>
      // Strange attractor:  x' = A1 sin(f1 y) + A2 cos(f2 x) + A3 sin(f3 t)
      //                     y' = A4 cos(f4 x) + A5 sin(f5 y) + A6 cos(f6 t)
      const BASE = [1, -0.1, -1.7, 1, 0.89, 0.89, -1.7, -1.7, -0.1, 1.3, 1.3, -1.7];
      const N = 500000, V = 0.1, ALPHA = 50 / 255; // points, time step, ink per point
      const RANGE = 0.5, DURATION = 6000;           // random excursion, loop length in ms
      const FROZEN = [8, 11];                       // f3 and f6 scale t; nudging them shatters the drawing

      const THREADS = Math.min(4, navigator.hardwareConcurrency || 2);

      const canvas = document.querySelector("canvas");
      const ctx = canvas.getContext("2d");
      const W = canvas.width;

      // The drawing is made in Web Workers: THREADS "trace" workers each follow one stretch of the
      // trajectory and splat its dots into a density buffer, and one "merge" worker sums the
      // stretches and tone-maps them into pixels. The main thread only uploads the result.
      function worker() {
        const SUB = 8, WARMUP = 1000;
        let W, N, V, ALPHA, role, from, to, warm, tWarm, KERNEL, LUT, ports, density, pending;
        const pool = [];

        self.onmessage = ({ data: m }) => {
          if (!m.init) { if (role === "trace") trace(m); else pool.push(m); return; }
          ({ W, N, V, ALPHA, role, from, to, ports } = m);
          if (role === "merge") {
            LUT = new Uint8Array(2048);
            for (let i = 0; i < 2048; i++) LUT[i] = Math.min(253, Math.round(255 * (1 - Math.exp(-i / 128))));
            density = new Float32Array(W * W);
            pending = ports.map(() => null);
            ports.forEach((port, i) => port.onmessage = ({ data }) => { pending[i] = data; if (pending.every(Boolean)) merge(); });
            return;
          }
          // Dots as Safari draws them: a soft-edged disc (radius 1.06px, edge 0.67px) sampled into a 5x5
          // coverage kernel per sub-pixel offset, stored as log(1 - coverage * ALPHA)
          KERNEL = new Float32Array(SUB * SUB * 25);
          for (let ky = 0; ky < SUB; ky++) for (let kx = 0; kx < SUB; kx++) {
            const cx = (kx + 0.5) / SUB, cy = (ky + 0.5) / SUB;
            for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) {
              let coverage = 0;
              for (let sy = 0; sy < 16; sy++) for (let sx = 0; sx < 16; sx++) {
                const ex = dx + (sx + 0.5) / 16 - cx, ey = dy + (sy + 0.5) / 16 - cy;
                coverage += Math.min(1, Math.max(0, 0.5 + (1.06 - Math.sqrt(ex * ex + ey * ey)) / 0.67));
              }
              KERNEL[(ky * SUB + kx) * 25 + (dy + 2) * 5 + dx + 2] = Math.log(1 - coverage / 256 * ALPHA);
            }
          }
          // The map is strongly contracting, so a stretch started from any state locks onto the one true
          // orbit within WARMUP steps. t is a running sum, so replay the additions to get its exact value.
          warm = Math.max(0, from - WARMUP);
          tWarm = 0;
          for (let i = 0; i < warm; i++) tWarm += V;
          ports[0].onmessage = ({ data }) => pool.push(data);
        };

        function trace(p) {
          const d = pool.pop() || new Float32Array(W * W);
          d.fill(0);
          let x = 0, y = 0, t = tWarm;
          for (let i = warm; i < to; i++) {
            const nx = p[0] * Math.sin(p[6] * y) + p[1] * Math.cos(p[7] * x) + p[2] * Math.sin(p[8] * t);
            const ny = p[3] * Math.cos(p[9] * x) + p[4] * Math.sin(p[10] * y) + p[5] * Math.cos(p[11] * t);
            x = nx; y = ny; t += V;
            if (i < from) continue;
            const ux = (nx + 4) / 8 * 672, uy = (ny + 4) / 8 * 672;   // p5's canvas coordinates
            // Safari thinning: WebKit keeps path points as 32-bit floats, so p5's "x + 1e-5" nudge that
            // makes a dot collapses to a zero-length line (drawn as nothing) for most x beyond 128.
            if (Math.fround(ux) === Math.fround(ux + 1e-5)) continue;
            const X = ux * 2, Y = uy * 2;
            const ix = Math.floor(X), iy = Math.floor(Y);
            if (ix >= 2 && ix < W - 2 && iy >= 2 && iy < W - 2) {
              let k = (((Y - iy) * SUB | 0) * SUB + ((X - ix) * SUB | 0)) * 25;
              for (let dy = -2; dy <= 2; dy++) {
                const b = (iy + dy) * W + ix - 2;
                for (let dx = 0; dx < 5; dx++) d[b + dx] += KERNEL[k++];
              }
            }
          }
          ports[0].postMessage(d, [d.buffer]);
        }

        function merge() {
          density.set(pending[0]);
          for (let j = 1; j < pending.length; j++) { const d = pending[j]; for (let i = 0; i < W * W; i++) density[i] += d[i]; }
          const buffer = pool.pop() || new ArrayBuffer(W * W * 4), pixels = new Uint32Array(buffer);
          for (let i = 0; i < W * W; i++) {
            const s = density[i];
            pixels[i] = s < 0 ? LUT[Math.min(2047, -s * 128 | 0)] << 24 : 0;
          }
          self.postMessage(buffer, [buffer]);
          pending.forEach((d, i) => { pending[i] = null; ports[i].postMessage(d, [d.buffer]); });
        }
      }

      const url = URL.createObjectURL(new Blob([`(${worker})()`], { type: "text/javascript" }));
      const shared = { init: true, W, N, V, ALPHA };
      const tracers = [], ports = [];
      for (let i = 0; i < THREADS; i++) {
        const { port1, port2 } = new MessageChannel(), tracer = new Worker(url);
        tracer.postMessage({ ...shared, role: "trace", from: Math.floor(i * N / THREADS), to: Math.floor((i + 1) * N / THREADS), ports: [port1] }, [port1]);
        tracers.push(tracer); ports.push(port2);
      }
      const merger = new Worker(url);
      merger.postMessage({ ...shared, role: "merge", ports }, ports);

      let inflight = false;
      function render(p) {
        inflight = true;
        for (const tracer of tracers) tracer.postMessage(p);
      }
      merger.onmessage = ({ data: buffer }) => {
        ctx.putImageData(new ImageData(new Uint8ClampedArray(buffer), W, W), 0, 0);
        merger.postMessage(buffer, [buffer]);
        inflight = false;
        if (start !== null) tick();
      };
      render(BASE);

      // One loop: drift the coefficients to a random neighbour and back along a cosine, so it
      // starts and ends at rest on BASE and the final frame is the identical drawing. Frames are
      // requested as soon as the previous one lands, so the loop runs as fast as the workers allow.
      let start = null, target;
      function play() {
        if (start !== null) return;
        target = BASE.map((v, i) => FROZEN.includes(i) ? v : v + (Math.random() * 2 - 1) * RANGE);
        start = performance.now();
        if (!inflight) tick();
      }
      function tick() {
        const s = Math.min(1, (performance.now() - start) / DURATION);
        const k = (1 - Math.cos(2 * Math.PI * s)) / 2;
        if (s >= 1) start = null;
        render(s < 1 ? BASE.map((v, i) => v + (target[i] - v) * k) : BASE);
      }
      canvas.addEventListener("click", play);
      for (const a of document.querySelectorAll("a")) a.addEventListener("mouseenter", play);
      // Scrolling replays it too: "scroll" when the page actually moves, "wheel" and "touchmove" for
      // viewports where the page fits and a scroll gesture moves nothing.
      for (const type of ["scroll", "wheel", "touchmove"]) window.addEventListener(type, play, { passive: true });
      window.addEventListener("load", () => setTimeout(play, 1000));
    </script>
  </body>
</html>
